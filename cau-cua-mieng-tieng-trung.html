<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Câu cửa miệng tiếng Trung</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --ink:#1f1b16; --muted:#6b6259; --line:#e8e0d4;
  --accent:#c0392b; --accent-soft:#fbeae7; --py:#2d6a8a; --ok:#2e7d4f; --ok-soft:#e5f3ea;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171412; --card:#221e1b; --ink:#f1ebe3; --muted:#a59a8e; --line:#3a332d;
    --accent:#ef6f5e; --accent-soft:#3a2420; --py:#7cbfe0; --ok:#6fcf97; --ok-soft:#1f3328;
  }
}
:root[data-theme="dark"]{
  --bg:#171412; --card:#221e1b; --ink:#f1ebe3; --muted:#a59a8e; --line:#3a332d;
  --accent:#ef6f5e; --accent-soft:#3a2420; --py:#7cbfe0; --ok:#6fcf97; --ok-soft:#1f3328;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 80px}
header h1{margin:0 0 4px;font-size:clamp(22px,4vw,30px)}
header p{margin:0;color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.bar input[type=search],.bar select{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);
  cursor:pointer;font-size:14px;white-space:nowrap}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stats{width:100%;font-size:13px;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.progress>div{height:100%;background:var(--ok);width:0;transition:width .3s}
section{margin-top:28px}
section h2{font-size:18px;margin:0 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
section h2 small{font-weight:400;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative}
.card.learned{background:var(--ok-soft);border-color:var(--ok)}
.num{font-size:12px;color:var(--muted)}
.zh{font-size:24px;font-weight:600;margin:2px 0;cursor:pointer}
.zh:hover{color:var(--accent)}
.py{color:var(--py);font-size:15px}
.vi{margin-top:4px}
.note{margin-top:6px;font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:6px 8px}
.actions{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.icon{border:none;background:transparent;cursor:pointer;font-size:17px;padding:4px;border-radius:6px;color:var(--muted)}
.icon:hover{background:var(--line)}
.hide-py .py,.hide-vi .vi,.hide-vi .note{filter:blur(6px);cursor:pointer;transition:filter .2s}
.card.reveal .py,.card.reveal .vi,.card.reveal .note{filter:none}
/* flashcard */
#fc{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;padding:16px;
  flex-direction:column;align-items:center;justify-content:center;text-align:center}
#fc.show{display:flex}
#fc .big{font-size:clamp(36px,10vw,64px);font-weight:700;cursor:pointer}
#fc .back{min-height:120px;margin-top:16px}
#fc .back .py{font-size:22px}
#fc .back .vi{font-size:20px}
#fc .ctr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}
#fc .top{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>💬 Câu cửa miệng tiếng Trung (口头禅)</h1>
    <p id="sub">Nói tiếng Trung tự nhiên như người bản xứ · bấm chữ Hán để nghe phát âm</p>
  </header>

  <div class="bar">
    <input type="search" id="q" placeholder="Tìm chữ Hán, pinyin hoặc nghĩa…">

    <button class="btn" id="tPy">Ẩn pinyin</button>
    <button class="btn" id="tVi">Ẩn nghĩa</button>
    <button class="btn" id="tTodo">Chưa thuộc</button>
    <button class="btn" id="tFc">🃏 Flashcard</button>
    <button class="btn" id="tTheme" title="Đổi giao diện">🌓</button>
    <div class="stats"><span id="stat"></span><div class="progress"><div id="prog"></div></div></div>
  </div>

  <main id="list"></main>
</div>

<div id="fc">
  <div class="top"><span id="fcPos"></span><button class="btn" id="fcClose">✕ Đóng</button></div>
  <div class="num" id="fcSec"></div>
  <div class="big" id="fcZh"></div>
  <div class="back" id="fcBack"></div>
  <div class="ctr">
    <button class="btn" id="fcPrev">← Trước</button>
    <button class="btn" id="fcFlip">Lật (Space)</button>
    <button class="btn" id="fcSpeak">🔊 Nghe</button>
    <button class="btn" id="fcLearn">✓ Đã thuộc</button>
    <button class="btn" id="fcShuffle">🔀 Trộn</button>
    <button class="btn" id="fcNext">Sau →</button>
  </div>
</div>

147. 先这样 / xiān zhèyàng / Tạm vậy đã
148. 那就这么定了 / nà jiù zhème dìng le / Vậy chốt thế nhé
149. 好了，不说了 / hǎo le, bù shuō le / Thôi, không nói nữa
150. 行了行了 / xíng le xíng le / Được rồi, được rồi (đủ rồi)
151. 回头再说 / huítóu zài shuō / Để sau nói tiếp
152. 有空再聊 / yǒu kòng zài liáo / Rảnh nói chuyện tiếp
153. 改天聊 / gǎitiān liáo / Hôm khác nói chuyện nhé
154. 拜拜啦 / bàibài la / Bye bye nha
`;

// ---- parse ----
const sections = [], items = [];
RAW.trim().split("\n").forEach(line => {
  line = line.trim(); if (!line) return;
  let m;
  if ((m = line.match(/^(.*?)\s*PHẦN\s+(\d+):\s*(.*?)\s*\((.*)\)\s*$/))) {
    sections.push({ id: +m[2], icon: m[1], title: m[3], zh: m[4] });
  } else if ((m = line.match(/^(\d+)\.\s*(.+?)\s*\/\s*(.+?)\s*\/\s*(.+)$/))) {
    items.push({ n: +m[1], zh: m[2], py: m[3], vi: m[4], sec: sections.length - 1, note: "" });
  } else if (line.startsWith("📝") && items.length) {
    items[items.length - 1].note = line.replace(/^📝\s*/, "");
  }
});

// ---- state ----
const store = {
  get(k, d) { try { const v = localStorage.getItem("ktc_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ktc_" + k, JSON.stringify(v)); } catch {} }
};
let learned = new Set(store.get("learned", []));
let hidePy = store.get("hidePy", false), hideVi = store.get("hideVi", false), onlyTodo = false;

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");

$("sub").textContent = `${items.length} câu thông dụng · ${sections.length} chủ đề · bấm chữ Hán để nghe phát âm`;
sections.forEach((s, i) => $("sec").insertAdjacentHTML("beforeend", `<option value="${i}">${s.icon} Phần ${s.id}: ${esc(s.title)}</option>`));

// ---- speech ----
let zhVoice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  zhVoice = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[…～~]/g, ""));
  u.lang = "zh-CN"; u.rate = 0.85; if (zhVoice) u.voice = zhVoice;
  speechSynthesis.speak(u);
}

// ---- render ----
function filtered() {
  const q = norm($("q").value.trim()), sec = $("sec").value;
  return items.filter(it =>
    (sec === "" || it.sec === +sec) &&
    (!onlyTodo || !learned.has(it.n)) &&
    (!q || norm(it.zh + " " + it.py + " " + it.vi + " " + it.note).includes(q) || String(it.n) === q));
}
function render() {
  document.body.classList.toggle("hide-py", hidePy);
  document.body.classList.toggle("hide-vi", hideVi);
  $("tPy").classList.toggle("on", hidePy); $("tPy").textContent = hidePy ? "Hiện pinyin" : "Ẩn pinyin";
  $("tVi").classList.toggle("on", hideVi); $("tVi").textContent = hideVi ? "Hiện nghĩa" : "Ẩn nghĩa";
  $("tTodo").classList.toggle("on", onlyTodo);

  const list = filtered(); let html = "";
  sections.forEach((s, i) => {
    const its = list.filter(it => it.sec === i); if (!its.length) return;
    html += `<section><h2>${s.icon} Phần ${s.id}: ${esc(s.title)} <small>${esc(s.zh)}</small></h2><div class="grid">`;
    its.forEach(it => {
      const L = learned.has(it.n);
      html += `<div class="card${L ? " learned" : ""}" data-n="${it.n}">
        <div class="actions">
          <button class="icon" data-act="speak" title="Nghe">🔊</button>
          <button class="icon" data-act="learn" title="${L ? "Bỏ đánh dấu" : "Đánh dấu đã thuộc"}">${L ? "✅" : "☐"}</button>
        </div>
        <div class="num">#${it.n}</div>
        <div class="zh" data-act="speak">${esc(it.zh)}</div>
        <div class="py">${esc(it.py)}</div>
        <div class="vi">${esc(it.vi)}</div>
        ${it.note ? `<div class="note">📝 ${esc(it.note)}</div>` : ""}
      </div>`;
    });
    html += `</div></section>`;
  });
  $("list").innerHTML = html || `<div class="empty">Không tìm thấy câu nào 🤔</div>`;
  $("stat").textContent = `Đã thuộc ${learned.size}/${items.length} câu · đang hiển thị ${list.length}`;
  $("prog").style.width = (learned.size / items.length * 100) + "%";
}
function toggleLearn(n) {
  learned.has(n) ? learned.delete(n) : learned.add(n);
  store.set("learned", [...learned]);
}

$("list").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const it = items.find(x => x.n === +card.dataset.n);
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "speak") speak(it.zh);
  else if (act === "learn") { toggleLearn(it.n); render(); }
  else card.classList.toggle("reveal");
});
$("q").addEventListener("input", render);
$("sec").addEventListener("change", render);
$("tPy").onclick = () => { hidePy = !hidePy; store.set("hidePy", hidePy); render(); };
$("tVi").onclick = () => { hideVi = !hideVi; store.set("hideVi", hideVi); render(); };
$("tTodo").onclick = () => { onlyTodo = !onlyTodo; render(); };

// theme
const themeOrder = ["auto", "light", "dark"];
function applyTheme(t) { t === "auto" ? document.documentElement.removeAttribute("data-theme") : document.documentElement.setAttribute("data-theme", t); }
let theme = store.get("theme", "auto"); applyTheme(theme);
$("tTheme").onclick = () => { theme = themeOrder[(themeOrder.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(theme); };

// ---- flashcard ----
let deck = [], pos = 0, flipped = false;
function fcShow() {
  const it = deck[pos]; flipped = false;
  $("fcPos").textContent = `${pos + 1} / ${deck.length}`;
  $("fcSec").textContent = `${sections[it.sec].icon} ${sections[it.sec].title} · #${it.n}`;
  $("fcZh").textContent = it.zh;
  $("fcBack").innerHTML = "";
  $("fcLearn").classList.toggle("on", learned.has(it.n));
}
function fcFlip() {
  const it = deck[pos]; flipped = !flipped;
  $("fcBack").innerHTML = flipped ? `<div class="py">${esc(it.py)}</div><div class="vi">${esc(it.vi)}</div>${it.note ? `<div class="note">📝 ${esc(it.note)}</div>` : ""}` : "";
}
function fcMove(d) { pos = (pos + d + deck.length) % deck.length; fcShow(); }
$("tFc").onclick = () => {
  deck = filtered(); if (!deck.length) return alert("Không có câu nào để ôn!");
  pos = 0; $("fc").classList.add("show"); fcShow();
};
$("fcClose").onclick = () => { $("fc").classList.remove("show"); render(); };
$("fcFlip").onclick = fcFlip; $("fcZh").onclick = fcFlip;
$("fcPrev").onclick = () => fcMove(-1); $("fcNext").onclick = () => fcMove(1);
$("fcSpeak").onclick = () => speak(deck[pos].zh);
$("fcLearn").onclick = () => { toggleLearn(deck[pos].n); $("fcLearn").classList.toggle("on", learned.has(deck[pos].n)); };
$("fcShuffle").onclick = () => { for (let i = deck.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [deck[i], deck[j]] = [deck[j], deck[i]]; } pos = 0; fcShow(); };
document.addEventListener("keydown", e => {
  if (!$("fc").classList.contains("show")) return;
  if (e.key === " ") { e.preventDefault(); fcFlip(); }
  else if (e.key === "ArrowRight") fcMove(1);
  else if (e.key === "ArrowLeft") fcMove(-1);
  else if (e.key === "Escape") $("fcClose").onclick();
  else if (e.key.toLowerCase() === "s") speak(deck[pos].zh);
});

render();
</script>
</body>
</html>
