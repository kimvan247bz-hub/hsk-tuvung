<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Học Từ Vựng Tiếng Trung</title>
<style>
:root{
  --cream:#faf3e7;
  --cream-2:#f3e9d7;
  --ink:#2e2a26;
  --ink-soft:#5c5449;
  --teal:#0f6b66;
  --teal-dark:#0a4f4b;
  --coral:#e8703a;
  --coral-dark:#c85a28;
  --card-bg:#ffffff;
  --border:#e6dcc8;
  --shadow:0 2px 8px rgba(46,42,38,0.08);
  --shadow-lg:0 8px 24px rgba(46,42,38,0.14);
  --radius:16px;
  --radius-sm:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}
.hanzi-font{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Heiti SC",sans-serif;}

/* ===== Layout shell ===== */
.app{
  display:flex;
  min-height:100vh;
}

/* ===== Sidebar ===== */
.sidebar{
  width:280px;
  flex-shrink:0;
  background:var(--teal-dark);
  color:#fff;
  padding:20px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.sidebar-title{
  font-size:1.1rem;
  font-weight:700;
  padding:6px 10px 18px;
  display:flex;
  align-items:center;
  gap:8px;
}
.sidebar-title .logo-emoji{font-size:1.5rem;}
.topic-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.topic-item{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  padding:12px 12px;
  border:none;
  border-radius:var(--radius-sm);
  background:rgba(255,255,255,0.06);
  color:#fff;
  text-align:left;
  transition:background .15s ease, transform .1s ease;
}
.topic-item:hover{background:rgba(255,255,255,0.14);}
.topic-item:active{transform:scale(0.98);}
.topic-item:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
.topic-item.active{
  background:var(--topic-color, var(--coral));
  box-shadow:var(--shadow);
}
.topic-emoji{font-size:1.4rem;flex-shrink:0;}
.topic-text{display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0;}
.topic-zh{font-weight:700;font-size:1rem;}
.topic-vi{font-size:0.78rem;opacity:0.85;}
.topic-count{
  font-size:0.7rem;
  background:rgba(255,255,255,0.18);
  padding:2px 8px;
  border-radius:999px;
  flex-shrink:0;
}

.saved-count-box{
  margin-top:18px;
  padding:12px;
  background:rgba(255,255,255,0.08);
  border-radius:var(--radius-sm);
  font-size:0.82rem;
  display:flex;
  align-items:center;
  gap:8px;
}

/* ===== Mobile menu button & overlay ===== */
.menu-toggle{
  display:none;
  position:fixed;
  top:12px;
  left:12px;
  z-index:60;
  width:44px;
  height:44px;
  border-radius:12px;
  background:var(--teal-dark);
  color:#fff;
  border:none;
  font-size:1.3rem;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow-lg);
}
.menu-toggle:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
.sidebar-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:45;
}

/* ===== Main content ===== */
.main{
  flex:1;
  min-width:0;
  padding:24px 32px 60px;
}

/* ===== Hero / topic intro ===== */
.hero{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px 28px;
  margin-bottom:22px;
  border-top:6px solid var(--topic-color, var(--teal));
}
.hero-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.hero-emoji{font-size:2.6rem;}
.hero-titles{flex:1;min-width:200px;}
.hero-zh{font-size:1.8rem;font-weight:800;line-height:1.2;}
.hero-vi{font-size:1.05rem;color:var(--ink-soft);margin-top:2px;}
.hero-count{
  font-size:0.85rem;
  font-weight:600;
  color:var(--teal-dark);
  background:var(--cream-2);
  padding:6px 12px;
  border-radius:999px;
  white-space:nowrap;
}
.hero-actions{
  display:flex;
  gap:12px;
  margin-top:20px;
  flex-wrap:wrap;
}
.btn-mode{
  flex:1;
  min-width:160px;
  padding:13px 18px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  font-weight:700;
  font-size:0.95rem;
  transition:all .15s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn-mode.primary{
  background:var(--teal);
  color:#fff;
}
.btn-mode.primary:hover{background:var(--teal-dark);}
.btn-mode.secondary{
  background:#fff;
  color:var(--coral-dark);
  border-color:var(--coral);
}
.btn-mode.secondary:hover{background:#fff3ec;}
.btn-mode:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
.btn-mode.active{
  box-shadow:0 0 0 3px rgba(15,107,102,0.25);
}

/* ===== Search ===== */
.search-wrap{
  margin-bottom:18px;
  position:sticky;
  top:0;
  z-index:20;
  background:var(--cream);
  padding:6px 0;
}
.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:999px;
  padding:12px 18px;
  box-shadow:var(--shadow);
}
.search-box input{
  flex:1;
  border:none;
  outline:none;
  font-size:1rem;
  background:transparent;
  color:var(--ink);
}
.search-icon{font-size:1.1rem;opacity:0.6;}
.search-result-count{
  font-size:0.82rem;
  color:var(--ink-soft);
  margin-top:8px;
  padding-left:6px;
}
.no-result{
  text-align:center;
  padding:50px 20px;
  color:var(--ink-soft);
  background:#fff;
  border-radius:var(--radius);
  border:1px dashed var(--border);
}
.no-result .nr-title{font-weight:700;font-size:1.05rem;margin-bottom:6px;color:var(--ink);}

/* ===== Flashcard grid (Học theo thẻ) ===== */
.card-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
@media (max-width:1100px){ .card-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width:820px){ .card-grid{grid-template-columns:repeat(2,1fr);} }

.vcard{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  position:relative;
  transition:transform .12s ease, box-shadow .12s ease;
}
.vcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.vcard-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
}
.vcard-emoji{
  font-size:2.6rem;
  line-height:1;
  background:var(--cream-2);
  border-radius:var(--radius-sm);
  width:64px;
  height:64px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.star-btn{
  background:none;
  border:none;
  font-size:1.5rem;
  color:#d8cdb8;
  padding:4px;
  border-radius:8px;
  line-height:1;
  min-width:40px;
  min-height:40px;
}
.star-btn.saved{color:var(--coral);}
.star-btn:hover{background:var(--cream-2);}
.star-btn:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}

.vcard-hanzi{font-size:1.9rem;font-weight:800;margin-top:4px;}
.vcard-pinyin-row{display:flex;align-items:center;gap:8px;}
.vcard-pinyin{color:var(--teal-dark);font-weight:600;font-size:1.02rem;}
.sound-btn{
  background:var(--teal);
  color:#fff;
  border:none;
  border-radius:999px;
  width:36px;
  height:36px;
  min-width:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1rem;
  flex-shrink:0;
}
.sound-btn:hover{background:var(--teal-dark);}
.sound-btn:active{transform:scale(0.92);}
.sound-btn:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
.vcard-nghia{font-size:0.98rem;color:var(--ink-soft);font-weight:600;}
.vcard-example{
  margin-top:6px;
  padding-top:10px;
  border-top:1px dashed var(--border);
  font-size:0.9rem;
}
.vcard-example .ex-zh{font-weight:600;margin-bottom:3px;}
.vcard-example .ex-pinyin{color:var(--coral-dark);font-size:0.85rem;margin-bottom:3px;}
.vcard-example .ex-vi{color:var(--ink-soft);font-size:0.85rem;}

/* ===== Quiz / Ôn nhanh mode ===== */
.quiz-wrap{
  max-width:480px;
  margin:0 auto;
  padding-top:8px;
}
.quiz-progress-label{
  text-align:center;
  font-weight:700;
  color:var(--teal-dark);
  margin-bottom:8px;
  font-size:0.95rem;
}
.progress-bar-track{
  height:8px;
  background:var(--cream-2);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:20px;
}
.progress-bar-fill{
  height:100%;
  background:var(--coral);
  border-radius:999px;
  transition:width .25s ease;
}
.flashcard{
  background:var(--card-bg);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow-lg);
  padding:32px 24px;
  text-align:center;
  min-height:340px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  transition:transform .1s ease;
}
.flashcard:active{transform:scale(0.99);}
.flashcard:focus-visible{outline:3px solid #ffd166;outline-offset:3px;}
.fc-emoji{font-size:4rem;margin-bottom:6px;}
.fc-hanzi{font-size:2.6rem;font-weight:800;}
.fc-pinyin{font-size:1.2rem;color:var(--teal-dark);font-weight:600;}
.fc-hint{
  margin-top:16px;
  font-size:0.8rem;
  letter-spacing:0.08em;
  color:var(--ink-soft);
  font-weight:700;
}
.fc-answer{
  margin-top:14px;
  padding-top:16px;
  border-top:1px dashed var(--border);
  width:100%;
}
.fc-nghia{font-size:1.15rem;font-weight:700;color:var(--coral-dark);margin-bottom:12px;}
.fc-ex-zh{font-weight:600;font-size:1.05rem;margin-bottom:4px;}
.fc-ex-pinyin{color:var(--coral-dark);font-size:0.92rem;margin-bottom:4px;}
.fc-ex-vi{color:var(--ink-soft);font-size:0.92rem;}

.quiz-actions{
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.quiz-actions .row-btns{display:flex;gap:10px;}
.q-btn{
  flex:1;
  padding:13px;
  border-radius:var(--radius-sm);
  border:2px solid transparent;
  font-weight:700;
  font-size:0.95rem;
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.q-btn:focus-visible{outline:3px solid #ffd166;outline-offset:2px;}
.q-replay{background:#fff;border-color:var(--teal);color:var(--teal-dark);}
.q-replay:hover{background:var(--cream-2);}
.q-forget{background:#fff;border-color:#c85a28;color:var(--coral-dark);}
.q-forget:hover{background:#fff3ec;}
.q-remember{background:var(--teal);color:#fff;}
.q-remember:hover{background:var(--teal-dark);}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ===== Mobile ===== */
@media (max-width:600px){
  .sidebar{
    position:fixed;
    left:0;top:0;bottom:0;
    z-index:50;
    transform:translateX(-100%);
    transition:transform .2s ease;
    width:78%;
    max-width:300px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.open{display:block;}
  .menu-toggle{display:flex;}
  .main{padding:70px 14px 50px;}
  .hero{padding:16px 16px;margin-bottom:14px;}
  .hero-emoji{font-size:2rem;}
  .hero-zh{font-size:1.35rem;}
  .hero-vi{font-size:0.9rem;}
  .hero-count{display:none;}
  .hero-actions{margin-top:14px;gap:8px;}
  .btn-mode{padding:11px 10px;font-size:0.85rem;min-width:0;}
  .search-wrap{position:sticky;top:0;padding:8px 0;}
  .card-grid{grid-template-columns:1fr;gap:12px;}
  .vcard{
    flex-direction:row;
    align-items:flex-start;
    gap:12px;
    padding:12px;
  }
  .vcard-emoji{width:52px;height:52px;font-size:2rem;flex-shrink:0;}
  .vcard-top{flex-direction:column;align-items:center;gap:6px;}
  .vcard-body{flex:1;min-width:0;}
  .vcard-hanzi{font-size:1.5rem;margin-top:0;}
  .star-btn{min-width:44px;min-height:44px;}
  .sound-btn{width:40px;height:40px;min-width:40px;}
  .flashcard{padding:22px 16px;min-height:280px;}
  .fc-emoji{font-size:3rem;}
  .fc-hanzi{font-size:2.1rem;}
  .quiz-actions .row-btns{flex-direction:column;}
  .q-replay{order:1;}
  .row-btns{order:2;}
}
@media (max-width:380px){
  .hero-zh{font-size:1.15rem;}
  .vcard-hanzi{font-size:1.3rem;}
  .fc-hanzi{font-size:1.8rem;}
  .btn-mode{font-size:0.78rem;padding:10px 6px;}
}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle" aria-label="Mở menu chủ đề">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app">
  <nav class="sidebar" id="sidebar" aria-label="Danh sách chủ đề từ vựng">
    <div class="sidebar-title"><span class="logo-emoji">📖</span> Học Tiếng Trung</div>
    <ul class="topic-list" id="topicList"></ul>
    <div class="saved-count-box">⭐ Từ đã lưu: <strong id="savedCount">0</strong></div>
  </nav>

  <main class="main">
    <section class="hero" id="hero"></section>

    <div class="search-wrap" id="searchWrap">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Tìm theo chữ Hán, pinyin hoặc nghĩa tiếng Việt..." aria-label="Tìm kiếm từ vựng">
      </div>
      <div class="search-result-count" id="resultCount"></div>
    </div>

    <div id="content"></div>
  </main>
</div>

<script>

  let currentTopic = TOPIC_ORDER[0];

  let quizIndex = 0;
  let quizFlipped = false;
  let quizWords = [];
  let currentAudio = null;
  let voicesReady = false;

  // ---------- Helpers ----------
  function wordKey(topicId, hanzi){ return topicId + "::" + hanzi; }

  function speak(text){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN';
      utter.rate = 0.8;
      const voices = window.speechSynthesis.getVoices();
      const zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
      if(zhVoice) utter.voice = zhVoice;
      window.speechSynthesis.speak(utter);
    }catch(e){ /* noop */ }
  }
  if('speechSynthesis' in window){
    window.speechSynthesis.onvoiceschanged = function(){ voicesReady = true; };
  }

  function getTopic(id){ return VOCAB_DATA[id]; }

  function matchesSearch(word, term){
    if(!term) return true;
    const t = term.trim().toLowerCase();
    return word.hanzi.includes(term.trim()) ||
           word.pinyin.toLowerCase().includes(t) ||
           word.nghia.toLowerCase().includes(t);
  }

  function filteredWords(topicId){
    const topic = getTopic(topicId);
    return topic.words.filter(w => matchesSearch(w, searchTerm));
  }

  // ---------- Sidebar ----------
  function renderSidebar(){
    const list = document.getElementById('topicList');
    list.innerHTML = '';

      const t = getTopic(id);
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'topic-item' + (id === currentTopic ? ' active' : '');
      btn.style.setProperty('--topic-color', t.color);
      btn.setAttribute('aria-pressed', id === currentTopic ? 'true' : 'false');
      btn.innerHTML = `
        <span class="topic-emoji" aria-hidden="true">${t.emoji}</span>
        <span class="topic-text">
          <span class="topic-zh hanzi-font">${t.zh}</span>
          <span class="topic-vi">${t.vi}</span>
        </span>
        <span class="topic-count">${t.words.length} từ</span>
      `;
      btn.addEventListener('click', () => selectTopic(id));
      li.appendChild(btn);
      list.appendChild(li);
    });
    document.getElementById('savedCount').textContent = savedWords.size;
  }

  function selectTopic(id){
    currentTopic = id;
    searchTerm = '';
    document.getElementById('searchInput').value = '';
    quizIndex = 0;
    quizFlipped = false;
    closeSidebarMobile();
    renderAll();
  }

  // ---------- Hero ----------
  function renderHero(){
    const t = getTopic(currentTopic);
    const hero = document.getElementById('hero');
    hero.style.setProperty('--topic-color', t.color);
    hero.innerHTML = `
      <div class="hero-top">
        <span class="hero-emoji" aria-hidden="true">${t.emoji}</span>
        <div class="hero-titles">
          <div class="hero-zh hanzi-font">${t.zh}</div>
          <div class="hero-vi">${t.vi}</div>
        </div>
        <div class="hero-count">${t.words.length} từ vựng</div>
      </div>
      <div class="hero-actions">
        <button class="btn-mode primary ${currentMode==='study'?'active':''}" id="btnStudy">📇 Học theo thẻ</button>
        <button class="btn-mode secondary ${currentMode==='quiz'?'active':''}" id="btnQuiz">⚡ Ôn nhanh</button>
      </div>
    `;
    document.getElementById('btnStudy').addEventListener('click', () => setMode('study'));
    document.getElementById('btnQuiz').addEventListener('click', () => setMode('quiz'));
  }

  function setMode(mode){
    currentMode = mode;
    if(mode === 'quiz'){
      quizIndex = 0;
      quizFlipped = false;
      quizWords = getTopic(currentTopic).words.slice();
    }
    renderAll();
  }

  // ---------- Study mode (card grid) ----------
  function renderStudyMode(){
    const container = document.getElementById('content');
    document.getElementById('searchWrap').style.display = 'block';
    const words = filteredWords(currentTopic);
    document.getElementById('resultCount').textContent = searchTerm
      ? `Tìm thấy ${words.length} từ`
      : `${words.length} từ trong chủ đề này`;

    if(words.length === 0){
      container.innerHTML = `
        <div class="no-result">
          <div class="nr-title">Chưa tìm thấy từ này</div>
          <div>Thử tìm bằng chữ Hán, pinyin hoặc nghĩa tiếng Việt.</div>
        </div>`;
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'card-grid';
    words.forEach(w => grid.appendChild(renderVocabCard(w)));
    container.innerHTML = '';
    container.appendChild(grid);
  }

  function renderVocabCard(w){
    const key = wordKey(currentTopic, w.hanzi);
    const isSaved = savedWords.has(key);
    const card = document.createElement('article');
    card.className = 'vcard';

    const top = document.createElement('div');
    top.className = 'vcard-top';
    top.innerHTML = `<div class="vcard-emoji" aria-hidden="true">${w.emoji}</div>`;
    const starBtn = document.createElement('button');
    starBtn.className = 'star-btn' + (isSaved ? ' saved' : '');
    starBtn.setAttribute('aria-label', isSaved ? `Bỏ lưu từ ${w.hanzi}` : `Lưu từ ${w.hanzi} vào danh sách từ khó`);
    starBtn.textContent = isSaved ? '★' : '☆';
    starBtn.addEventListener('click', () => toggleSaved(key, starBtn));
    top.appendChild(starBtn);

    const body = document.createElement('div');
    body.className = 'vcard-body';
    body.innerHTML = `
      <div class="vcard-hanzi hanzi-font">${w.hanzi}</div>
      <div class="vcard-pinyin-row">
        <span class="vcard-pinyin">${w.pinyin}</span>
        <button class="sound-btn" aria-label="Nghe phát âm từ ${w.hanzi}">🔊</button>
      </div>
      <div class="vcard-nghia">${w.nghia}</div>
      <div class="vcard-example">
        <div class="ex-zh hanzi-font">${w.cauZh}</div>
        <div class="ex-pinyin">${w.cauPinyin}</div>
        <div class="ex-vi">${w.cauVi}</div>
      </div>
    `;
    card.appendChild(top);
    card.appendChild(body);

    body.querySelector('.sound-btn').addEventListener('click', () => speak(w.hanzi));

    return card;
  }

  function toggleSaved(key, btnEl){
    if(savedWords.has(key)){
      savedWords.delete(key);
      btnEl.classList.remove('saved');
      btnEl.textContent = '☆';
    } else {
      savedWords.add(key);
      btnEl.classList.add('saved');
      btnEl.textContent = '★';
    }
    document.getElementById('savedCount').textContent = savedWords.size;
  }

  // ---------- Quiz mode ----------
  function renderQuizMode(){
    document.getElementById('searchWrap').style.display = 'none';
    const container = document.getElementById('content');
    if(quizWords.length === 0){
      quizWords = getTopic(currentTopic).words.slice();
    }
    const total = quizWords.length;
    const idx = quizIndex % total;
    const w = quizWords[idx];
    const progressPct = ((idx+1) / total) * 100;

    container.innerHTML = `
      <div class="quiz-wrap">
        <div class="quiz-progress-label">THẺ ${idx+1} / ${total}</div>
        <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${progressPct}%"></div></div>
        <div class="flashcard" id="flashcard" tabindex="0" role="button" aria-label="Thẻ từ vựng, chạm để xem nghĩa">
          <div class="fc-emoji" aria-hidden="true">${w.emoji}</div>
          <div class="fc-hanzi hanzi-font">${w.hanzi}</div>
          <div class="fc-pinyin">${w.pinyin}</div>
          ${quizFlipped ? `
            <div class="fc-answer">
              <div class="fc-nghia">${w.nghia}</div>
              <div class="fc-ex-zh hanzi-font">${w.cauZh}</div>
              <div class="fc-ex-pinyin">${w.cauPinyin}</div>
              <div class="fc-ex-vi">${w.cauVi}</div>
            </div>
          ` : `<div class="fc-hint">CHẠM ĐỂ XEM NGHĨA</div>`}
        </div>
        <div class="quiz-actions">
          <div class="row-btns" style="display:flex;">
            <button class="q-btn q-replay" id="btnReplay" aria-label="Nghe lại phát âm">🔁 Nghe lại</button>
          </div>
          <div class="row-btns">
            <button class="q-btn q-forget" id="btnForget" aria-label="Đánh dấu chưa nhớ từ này">✗ Chưa nhớ</button>
            <button class="q-btn q-remember" id="btnRemember" aria-label="Đánh dấu đã nhớ từ này">✓ Đã nhớ →</button>
          </div>
        </div>
      </div>
    `;

    const fc = document.getElementById('flashcard');
    fc.addEventListener('click', () => {
      quizFlipped = !quizFlipped;
      renderQuizMode();
    });
    fc.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        quizFlipped = !quizFlipped;
        renderQuizMode();
      }
    });
    document.getElementById('btnReplay').addEventListener('click', (e) => {
      e.stopPropagation();
      speak(w.hanzi);
    });
    document.getElementById('btnForget').addEventListener('click', (e) => {
      e.stopPropagation();
      nextQuizCard();
    });
    document.getElementById('btnRemember').addEventListener('click', (e) => {
      e.stopPropagation();
      nextQuizCard();
    });
  }

  function nextQuizCard(){
    const total = quizWords.length;
    quizIndex = (quizIndex + 1) % total;
    quizFlipped = false;
    renderQuizMode();
  }

  // ---------- Search ----------
  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchTerm = e.target.value;
    if(currentMode === 'study') renderStudyMode();
  });

  // ---------- Mobile sidebar ----------
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const menuToggle = document.getElementById('menuToggle');

  function openSidebarMobile(){
    sidebar.classList.add('open');
    overlay.classList.add('open');
    menuToggle.setAttribute('aria-expanded', 'true');
  }
  function closeSidebarMobile(){
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }
  menuToggle.addEventListener('click', () => {
    if(sidebar.classList.contains('open')) closeSidebarMobile();
    else openSidebarMobile();
  });
  overlay.addEventListener('click', closeSidebarMobile);

  // ---------- Master render ----------
  function renderAll(){
    renderSidebar();
    renderHero();
    if(currentMode === 'study'){
      renderStudyMode();
    } else {
      renderQuizMode();
    }
  }

  renderAll();
})();
</script>
</body>
</html>
