:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --bg:#0f1a1b; --surface:#182728; --ink:#e6efed; --muted:#93a8a8; --line:#2c4042;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:1.5rem;margin:0;text-wrap:balance;line-height:1.25}
.sub{color:var(--muted);margin:4px 0 0;font-size:.92rem}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px}

.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}

.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.small{font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:260px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;cursor:pointer}
.han{font-family:var(--han);font-weight:700;font-size:clamp(1.9rem,8vw,2.9rem);line-height:1.3;overflow-wrap:anywhere}
.py{color:var(--jade);font-size:1.15rem;font-weight:500}
.vi{font-size:1.15rem}
.note{color:var(--muted);font-size:.9rem;max-width:46ch}
.hint{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1 1 120px}
.primary{background:var(--jade);color:var(--on-jade);border-color:var(--jade);font-weight:600}
.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.opts{display:grid;gap:10px}
.opts button{text-align:left;padding:12px 14px}
.opts .han{font-size:1.3rem}
.q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;text-align:center}
.explain{padding:12px 14px;border-radius:8px;background:var(--jade-soft)}
h2{font-size:1.02rem;margin:22px 0 6px;color:var(--jade)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:2.2em 1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.item .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.86rem;padding-top:6px}
.item .han{font-size:1.3rem}
.item > div{min-width:0}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line);margin-top:10px}
.dot.on{background:var(--jade);border-color:var(--jade)}

label.chk{display:flex;gap:6px;align-items:center;font-size:.92rem}

我考虑一下，明天给你答复。|wǒ kǎolǜ yíxià, míngtiān gěi nǐ dáfù|Để tôi cân nhắc, mai trả lời bạn.
今天太忙了，改天再说吧。|jīntiān tài máng le, gǎitiān zài shuō ba|Hôm nay bận quá, hôm khác nói sau nhé.
我现在有点儿事，一会儿再给你打电话。|wǒ xiànzài yǒudiǎnr shì, yíhuìr zài gěi nǐ dǎ diànhuà|Giờ tôi đang có chút việc, lát nữa gọi lại cho bạn.|一会儿 chuẩn từ điển là yíhuìr; khẩu ngữ cũng hay đọc yìhuǐr
辛苦了，早点儿回去休息吧。|xīnkǔ le, zǎo diǎnr huíqù xiūxi ba|Vất vả rồi, về nghỉ sớm đi.
慢慢来，别着急。|mànmàn lái, bié zháojí|Cứ từ từ, đừng vội.
天气冷了，多穿点儿衣服。|tiānqì lěng le, duō chuān diǎnr yīfu|Trời lạnh rồi, mặc thêm áo vào.
祝你一切顺利！|zhù nǐ yíqiè shùnlì|Chúc bạn mọi việc thuận lợi!`;
const P=RAW.split("\n").map((l,i)=>{const[h,p,v,n]=l.split("|");return{id:i+1,h,p,v,n:n||""}});
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let known=new Set();
try{known=new Set(JSON.parse(localStorage.getItem("known100")||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem("known100",JSON.stringify([...known]))}catch(e){}};
function pool(){const s=+$("sec").value;if(s<0)return P;const a=SECS[s][1],b=s+1<SECS.length?SECS[s+1][1]:P.length+1;return P.filter(x=>x.id>=a&&x.id<b)}
function progress(){$("prog").textContent=`Đã thuộc ${known.size}/${P.length} câu`;$("progbar").style.width=(known.size/P.length*100)+"%"}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const canSpeak="speechSynthesis" in window;

// Thẻ ghi nhớ
let deck=[],pos=0,flipped=false;
function buildDeck(){let d=pool();if($("onlyNew").checked)d=d.filter(x=>!known.has(x.id));deck=shuffle(d);pos=0;flipped=false;drawCard()}
function drawCard(){const c=$("card");
  if(!deck.length){c.innerHTML=`<div class="vi">Chủ đề này bạn đã thuộc hết.</div><div class="hint">Bỏ chọn “Chỉ ôn câu chưa thuộc” để ôn lại.</div>`;$("fcpos").textContent="";return}
  if(pos>=deck.length){c.innerHTML=`<div class="vi">Hết lượt ${deck.length} thẻ.</div><div class="hint">Bấm vào đây để xáo và ôn lượt mới.</div>`;$("fcpos").textContent="";return}
  const x=deck[pos],zh=$("dir").value==="zh";
  const front=zh?`<div class="han" lang="zh">${esc(x.h)}</div>`:`<div class="vi">${esc(x.v)}</div>`;
  const back=`<div class="han" lang="zh">${esc(x.h)}</div><div class="py">${esc(x.p)}</div><div class="vi">${esc(x.v)}</div>${x.n?`<div class="note">Lưu ý: ${esc(x.n)}</div>`:""}`;
  c.innerHTML=flipped?back:front+`<div class="hint">Bấm để lật thẻ</div>`;
  $("fcpos").textContent=`Thẻ ${pos+1}/${deck.length} · câu số ${x.id}`}
$("card").onclick=()=>{if(pos>=deck.length){buildDeck();return}flipped=!flipped;drawCard()};
function mark(ok){if(pos>=deck.length)return;const x=deck[pos];ok?known.add(x.id):known.delete(x.id);save();progress();pos++;flipped=false;drawCard()}
$("bOk").onclick=()=>mark(true);$("bNo").onclick=()=>mark(false);
$("bSpk").onclick=()=>{if(pos<deck.length)speak(deck[pos].h)};
if(!canSpeak)$("bSpk").hidden=true;
$("onlyNew").onchange=buildDeck;

// Trắc nghiệm
let qs=[],qi=0,score=0,wrong=[];
function startQuiz(){qs=shuffle(pool()).slice(0,10);qi=0;score=0;wrong=[];drawQ()}
function drawQ(){const b=$("qzbody");
  if(qi>=qs.length){b.innerHTML=`<div class="q"><div class="han">${score}/${qs.length}</div><div class="vi">${score===qs.length?"Đúng hết. Thử chủ đề khác nhé.":"Các câu cần ôn lại:"}</div></div>
   <div class="list">${wrong.map(x=>`<div class="item"><span class="n">${x.id}</span><div><div class="han" lang="zh">${esc(x.h)}</div><div class="py">${esc(x.p)}</div><div>${esc(x.v)}</div></div><span></span></div>`).join("")}</div>
   <div class="row" style="margin-top:14px"><button class="primary" id="again">Làm lượt mới</button></div>`;$("again").onclick=startQuiz;return}
  const x=qs[qi],zh=$("dir").value==="zh";
  const opts=shuffle([x,...shuffle(P.filter(y=>y.id!==x.id&&y.v!==x.v&&y.h!==x.h)).slice(0,3)]);
  b.innerHTML=`<div class="small" style="margin-bottom:8px">Câu ${qi+1}/${qs.length} · đúng ${score}</div>
   <div class="q">${zh?`<div class="han" lang="zh">${esc(x.h)}</div><div class="hint">Câu này nghĩa là gì?</div>`:`<div class="vi">${esc(x.v)}</div><div class="hint">Nói bằng tiếng Trung thế nào?</div>`}</div>
   <div class="opts" style="margin-top:12px">${opts.map(o=>`<button data-id="${o.id}">${zh?esc(o.v):`<span class="han" lang="zh">${esc(o.h)}</span>`}</button>`).join("")}</div>
   <div id="fb" style="margin-top:12px"></div>`;
  b.querySelectorAll(".opts button").forEach(bt=>bt.onclick=()=>{
    const ok=+bt.dataset.id===x.id;
    b.querySelectorAll(".opts button").forEach(o=>{o.disabled=true;if(+o.dataset.id===x.id)o.classList.add("ok")});
    if(ok)score++;else{bt.classList.add("no");wrong.push(x);known.delete(x.id);save();progress()}
    $("fb").innerHTML=`<div class="explain"><b>${ok?"Đúng.":"Chưa đúng."}</b> <span lang="zh">${esc(x.h)}</span> · ${esc(x.p)} · ${esc(x.v)}${x.n?`<br><span class="small">Lưu ý: ${esc(x.n)}</span>`:""}</div>
     <div class="row" style="margin-top:10px"><button class="primary" id="next">${qi+1<qs.length?"Câu tiếp":"Xem kết quả"}</button></div>`;
    $("next").onclick=()=>{qi++;drawQ()};$("next").focus()})}

// Danh sách
function drawList(){const s=+$("sec").value,hp=$("hidePy").checked,hv=$("hideVi").checked;
  const groups=s<0?SECS.map((_,i)=>i):[s];
  $("lsbody").innerHTML=groups.map(g=>{const a=SECS[g][1],b=g+1<SECS.length?SECS[g+1][1]:P.length+1;
    return `<h2>Phần ${g+1}: ${esc(SECS[g][0])}</h2><div class="list">`+P.filter(x=>x.id>=a&&x.id<b).map(x=>
     `<div class="item"><span class="n">${x.id}</span><div><div class="han" lang="zh">${esc(x.h)}${canSpeak?` <button class="spk" data-s="${x.id}">nghe</button>`:""}</div><div class="py${hp?" blur":""}">${esc(x.p)}</div><div class="${hv?"blur":""}">${esc(x.v)}</div>${x.n?`<div class="note${hv?" blur":""}">Lưu ý: ${esc(x.n)}</div>`:""}</div><span class="dot${known.has(x.id)?" on":""}" title="${known.has(x.id)?"Đã thuộc":"Chưa thuộc"}"></span></div>`).join("")+"</div>"}).join("")}
$("lsbody").onclick=e=>{const t=e.target;if(t.dataset.s)speak(P[t.dataset.s-1].h);else if(t.classList.contains("blur"))t.classList.remove("blur")};
$("hidePy").onchange=$("hideVi").onchange=drawList;

// Điều hướng
$("sec").innerHTML=`<option value="-1">Tất cả ${P.length} câu</option>`+SECS.map((s,i)=>`<option value="${i}">${i+1}. ${esc(s[0])}</option>`).join("");
let tab="fc";
function refresh(){if(tab==="fc")buildDeck();else if(tab==="qz")startQuiz();else drawList()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(o=>o.setAttribute("aria-selected",o===b));
  ["fc","qz","ls"].forEach(id=>$(id).hidden=id!==tab);refresh()});
$("sec").onchange=$("dir").onchange=refresh;
progress();refresh();
</script>
</body>
</html>
